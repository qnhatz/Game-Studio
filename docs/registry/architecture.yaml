# ─── INTERFACE CONTRACTS ────────────────────────────────────────────────────────────────────

interfaces:
  - contract: scene_state_transition
    status: active
    pattern: direct_call
    producer: any-system
    consumers:
      - GameStateMachine
    adr: docs/architecture/adr-0001-scene-topology.md
    signal_signature: "GameStateMachine.transition_to(state: StringName) — states: MENU, IN_MATCH, RESULT"
    notes: "Never call change_scene_to_file() or PackedScene.instantiate() mid-session. Use show()/hide() on CanvasLayer nodes only. Always call gui_release_focus() before hide()."
    referenced_by:
      - docs/architecture/adr-0001-scene-topology.md
    added: 2026-05-10
    revised: ""

  - contract: shot_resolution_critical_path
    status: active
    pattern: direct_call
    producer: TwoActionTurnSystem
    consumers:
      - ShotSpreadCalculation
      - BodyZoneHitDetection
      - StatusEffects
      - WinCondition
    adr: docs/architecture/adr-0004-system-communication.md
    signal_signature: "on_action_selected(action_type: StringName, flick_event: FlickEvent) — synchronous; no signals in this chain"
    notes: "Pattern A: all calls in shot → hit → win chain are synchronous direct calls. No CONNECT_DEFERRED. No signals within this path."
    referenced_by:
      - docs/architecture/adr-0004-system-communication.md
    added: 2026-05-10
    revised: ""

  - contract: match_lifecycle_signals
    status: active
    pattern: signal
    producer: WinCondition
    consumers:
      - GameModeManager
    adr: docs/architecture/adr-0004-system-communication.md
    signal_signature: "match_won(winner_id: int) — WinCondition → GameModeManager (sole listener); then match_ended(winner_id, config) → GameStateMachine"
    notes: "Pattern B: typed signals for cross-layer notifications. No string-based connect()."
    referenced_by:
      - docs/architecture/adr-0004-system-communication.md
    added: 2026-05-10
    revised: ""


